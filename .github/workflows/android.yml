name: PantryPal Android build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PantryPal APK
    runs-on: ubuntu-latest
    env:
      PANTRYPAL_KEYSTORE_BASE64: ${{ secrets.PANTRYPAL_KEYSTORE_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Prepare release signing key
        if: ${{ env.PANTRYPAL_KEYSTORE_BASE64 != '' }}
        env:
          PANTRYPAL_KEYSTORE_BASE64: ${{ secrets.PANTRYPAL_KEYSTORE_BASE64 }}
        run: |
          echo "$PANTRYPAL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pantrypal-release.jks"
          echo "PANTRYPAL_KEYSTORE_PATH=$RUNNER_TEMP/pantrypal-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ env.PANTRYPAL_KEYSTORE_BASE64 != '' }}
        env:
          PANTRYPAL_KEYSTORE_BASE64: ${{ secrets.PANTRYPAL_KEYSTORE_BASE64 }}
          PANTRYPAL_KEYSTORE_PASSWORD: ${{ secrets.PANTRYPAL_KEYSTORE_PASSWORD }}
          PANTRYPAL_KEY_ALIAS: ${{ secrets.PANTRYPAL_KEY_ALIAS }}
          PANTRYPAL_KEY_PASSWORD: ${{ secrets.PANTRYPAL_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Build debug APK (until release signing is configured)
        if: ${{ env.PANTRYPAL_KEYSTORE_BASE64 == '' }}
        run: gradle --no-daemon assembleDebug
      - name: Upload PantryPal release APK
        if: ${{ env.PANTRYPAL_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PantryPal-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload PantryPal APK
        if: ${{ env.PANTRYPAL_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PantryPal-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          PANTRYPAL_KEYSTORE_BASE64: ${{ secrets.PANTRYPAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PANTRYPAL_KEYSTORE_BASE64" ]; then
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
            NOTES="PantryPal signed release APK."
          else
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
            NOTES="PantryPal debug-signed testing APK. Configure signing secrets for a signed release build."
          fi
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" --title "PantryPal $GITHUB_REF_NAME" --notes "$NOTES"
